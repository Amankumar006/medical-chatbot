<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Companion - Care Navigation & Consultation Prep</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="home.css">
    <link rel="manifest" href="manifest.json">
</head>

<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <div class="sidebar">
            <div class="logo">
                <img src="avatar.webp" alt="Logo">
                <div>
                    <h2>HealthAI</h2>
                    <small style="color: var(--secondary); font-size: 0.75rem;">Offline Care Companion</small>
                </div>
            </div>

            <nav class="nav-menu">
                <a class="nav-link active" data-target="chat"><i class="fas fa-comments"></i> Chat Assistant</a>
                <a class="nav-link" data-target="prep"><i class="fas fa-clipboard-list"></i> Pre-Visit Prep</a>
                <a class="nav-link" data-target="summary"><i class="fas fa-file-medical"></i> Visit Summary</a>
                <a class="nav-link" data-target="directory"><i class="fas fa-map-marked-alt"></i> Care Directory</a>
            </nav>

            <div style="margin-top: auto; padding: 1rem; font-size: 0.8rem; opacity: 0.7; border-top: 1px solid var(--border-color);">
                <i class="fas fa-shield-alt"></i> 100% On-Device Storage<br>Zero Cloud PII
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="main-content">
            <div class="chat-header">
                <div>
                    <h2 id="view-title">AI Health Assistant</h2>
                    <p id="view-subtitle">Offline-first vernacular consultation prep & navigation companion</p>
                </div>
                <div class="quick-actions">
                    <button id="voice-dictate-btn" class="action-button" aria-label="Voice input" title="Voice Input"><i class="fas fa-microphone"></i></button>
                </div>
            </div>

            <!-- Dynamic View Container -->
            <div id="main-view-container" class="content-view">
                <!-- Chat Interface (Default) -->
                <div class="chat-interface" id="chat-view-root">
                    <div id="chat-box" class="chat-messages" aria-live="polite"></div>

                    <div id="typing-indicator" class="typing-indicator" style="display:none;">
                        <div class="typing-dots"><span></span><span></span><span></span></div>
                        <span class="typing-text">Assistant is thinking...</span>
                    </div>

                    <div class="chat-input-container">
                        <div class="input-wrapper">
                            <input type="text" id="user-input" placeholder="Type your health question or symptoms..." aria-label="Chat input">
                            <button id="send-button" class="send-btn"><i class="fas fa-paper-plane"></i><span>Send</span></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="js/app/main.js"></script>
</body>

</html>
